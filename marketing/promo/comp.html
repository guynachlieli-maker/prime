<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;600;800;900&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070605; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070605; font-family: 'Heebo', sans-serif; color: #f4eee1; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .phone, .card, .chip, .seal, .xmark, .ring, .shield, .hl, .glow { left: 0; top: 0; }
  .chip, .seal, .shield, .xmark { z-index: 50; }
  .full { position: absolute; inset: 0; }
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); }
  .gold-text {
    font-family: 'Frank Ruhl Libre', serif; font-weight: 900;
    background: linear-gradient(135deg, #9c7a32 0%, #d8b45e 30%, #fff1c4 50%, #e2bd62 68%, #8f6c27 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #3a2a0c) drop-shadow(0 18px 40px rgba(216,180,94,.35));
  }
  .white-text { font-family: 'Frank Ruhl Libre', serif; font-weight: 900; color: #f6f0e2; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .center { width: 1080px; text-align: center; }
  .phone {
    position: absolute; width: 620px; height: 1342px; border-radius: 92px; padding: 18px;
    background: linear-gradient(140deg, #f6e2a6 0%, #9c7a32 22%, #2a2112 48%, #d8b45e 74%, #6b5220 100%);
    box-shadow: 0 60px 120px rgba(0,0,0,.75), 0 0 0 2px rgba(255,236,190,.25) inset, 0 0 90px rgba(216,180,94,.18);
    transform-style: preserve-3d;
  }
  .phone .screen { position: relative; width: 100%; height: 100%; border-radius: 76px; overflow: hidden; background: #0b0a08; }
  .phone .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; filter: brightness(1.22) contrast(1.05) saturate(1.12); }
  .phone .glare { position: absolute; inset: 18px; border-radius: 76px; background: linear-gradient(115deg, transparent 30%, rgba(255,245,220,.16) 45%, transparent 58%); pointer-events: none; }
  .notch { position: absolute; top: 34px; left: 50%; width: 170px; height: 44px; margin-left: -85px; border-radius: 30px; background: #000; z-index: 3; }
  .card { position: absolute; width: 520px; height: 300px; border-radius: 34px; background: linear-gradient(160deg, #26231d, #141210); border: 2px solid #3b352a; padding: 40px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 40px 80px rgba(0,0,0,.6); }
  .card b { font-size: 46px; font-weight: 800; color: #b9b1a1; }
  .card .lines i { display: block; height: 16px; border-radius: 8px; background: #3a352c; margin-top: 16px; }
  .xmark { width: 240px; text-align: center; line-height: 1; position: absolute; font-size: 210px; font-weight: 900; color: #e5484d; text-shadow: 0 0 40px rgba(229,72,77,.55); font-family: 'Heebo'; }
  .chip { position: absolute; padding: 22px 40px; border-radius: 999px; font-size: 44px; font-weight: 800; color: #1a1408; white-space: nowrap;
    background: linear-gradient(135deg, #9c7a32, #d8b45e 35%, #f6e2a6 52%, #d1a94f 72%, #8f6c27); box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.4); }
  .chip.dark { background: rgba(20,17,12,.88); color: #f3dc9a; border: 2px solid rgba(216,180,94,.6); }
  .counter { font-family: 'Frank Ruhl Libre', serif; font-weight: 900; }
  #caption { position: absolute; left: 70px; right: 70px; top: 1548px; text-align: center; }
  #caption .cap { display: inline-block; padding: 18px 34px; border-radius: 26px; background: rgba(8,7,5,.72); border: 1.5px solid rgba(216,180,94,.35);
    font-family: 'Heebo'; font-weight: 800; font-size: 58px; line-height: 1.25; color: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  #caption .w { display: inline-block; margin: 0 7px; transition: none; }
  #caption .w.on { color: #f3d27f; text-shadow: 0 0 24px rgba(243,210,127,.55); }
  #caption .w.past { color: #fff; }
  #caption .w.future { color: rgba(255,255,255,.55); }
  .ring { position: absolute; border-radius: 50%; border: 6px solid rgba(243,220,154,.9); }
  .hl { position: absolute; border: 6px solid #f3d27f; border-radius: 30px; box-shadow: 0 0 40px rgba(243,210,127,.7), inset 0 0 30px rgba(243,210,127,.25); }
  #grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: .085; mix-blend-mode: overlay; image-rendering: pixelated; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(130% 85% at 50% 45%, transparent 55%, rgba(0,0,0,.72) 100%); }
  #flash { position: absolute; inset: 0; background: radial-gradient(60% 40% at 50% 45%, #fff6d8, #e8c879 40%, transparent 75%); opacity: 0; mix-blend-mode: screen; }
  .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; }
  .seal { position: absolute; padding: 18px 30px; border-radius: 20px; font-size: 40px; font-weight: 900; letter-spacing: .04em; color: #f3dc9a; background: rgba(20,17,12,.85); border: 2px solid rgba(216,180,94,.7); white-space: nowrap; direction: ltr; }
  .shield { position: absolute; width: 190px; height: 220px; }
  .lens { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="stage">
  <div class="full" id="bg"></div>
  <div class="glow" id="g1" style="width:900px;height:900px;background:#b8892e;opacity:.22"></div>
  <div class="glow" id="g2" style="width:700px;height:700px;background:#6b4f17;opacity:.25"></div>
  <canvas id="particles" width="1080" height="1920" class="full"></canvas>
  <div id="layer" class="full" style="perspective:2600px;perspective-origin:50% 42%"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <canvas id="grain" width="270" height="480"></canvas>
  <div id="caption"></div>
</div>
<script>
// ---------------------------------------------------------------------------------------------
// Deterministic motion engine: window.render(t) draws the frame at time t (seconds).
// ---------------------------------------------------------------------------------------------
const TL = window.TIMELINE; // injected
const L = Object.fromEntries(TL.lines.map((l) => [l.id, l]));
const S = (p) => 'screens/' + p + '.png';
const layer = document.getElementById('layer');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out: (k) => 1 - Math.pow(1 - clamp(k), 3),
  in: (k) => Math.pow(clamp(k), 3),
  io: (k) => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; },
  back: (k) => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  expo: (k) => (clamp(k) >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(k))),
};
const prog = (t, a, b) => clamp((t - a) / (b - a));
let seed = 1;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function phone(src) {
  const p = el(`<div class="phone"><div class="screen"><div class="notch"></div></div><div class="glare"></div></div>`);
  const scr = p.querySelector('.screen');
  (Array.isArray(src) ? src : [src]).forEach((s, i) => { const im = document.createElement('img'); im.src = S(s); im.dataset.i = i; scr.appendChild(im); });
  return p;
}
const FRONT = /\b(chip|seal|shield|xmark)\b/;
function setT(node, { x = 0, y = 0, z = FRONT.test(node.getAttribute('class') || '') ? 160 : 0, rx = 0, ry = 0, rz = 0, s = 1, o = 1, blur = 0 }) {
  node.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  node.style.opacity = o;
  node.style.filter = blur > 0.05 ? `blur(${blur}px)` : '';
}
function showImg(p, idx, mix = 1) { // crossfade images inside a phone: idx can be fractional
  p.querySelectorAll('.screen img').forEach((im) => { const i = +im.dataset.i; im.style.opacity = clamp(1 - Math.abs(idx - i) / mix); });
}
const PX = 230, PY = 300;
const RX = (n, margin = 110) => 1080 - margin - (n.offsetWidth || 400); // x for a right-aligned element // default phone position (centered)

// ---------------- scene construction ----------------
const scenes = [];
function scene(id, a, b, build, draw) { const root = el('<div class="full" style="transform-style:preserve-3d"></div>'); layer.appendChild(root); const ctx = build(root) || {}; scenes.push({ id, a, b, root, ctx, draw }); }

// timing anchors (scene windows overlap slightly for transitions)
const LEAD = 0.28; // next scene starts entering while the previous one whips out
const T = {
  hook: [0, L.why.start - 0.05],
  why: [L.why.start - 0.05, L.brand.start - 0.35],
  brand: [L.brand.start - 0.35, L.one.start - 0.15],
  one: [L.one.start - 0.15 - LEAD, L.camera.start - 0.15],
  camera: [L.camera.start - 0.15 - LEAD, L.menu.start - 0.12],
  menu: [L.menu.start - 0.12 - LEAD, L.train.start - 0.12],
  train: [L.train.start - 0.12 - LEAD, L.body.start - 0.12],
  body: [L.body.start - 0.12 - LEAD, L.trust.start - 0.12],
  trust: [L.trust.start - 0.12 - LEAD, L.cta.start - 0.25],
  cta: [L.cta.start - 0.25 - 0.15, TL.total + 1],
};

// 1. HOOK -------------------------------------------------------------------------------------
scene('hook', ...T.hook, (r) => {
  const cards = [['דיאטה מהאינטרנט', 40, 300, -9], ['תפריט כללי', 500, 520, 8], ['אפליקציה גנרית', 70, 760, -5]].map(([t, x, y, rz]) => {
    const c = el(`<div class="card"><b>${t}</b><div class="lines"><i style="width:90%"></i><i style="width:70%"></i><i style="width:80%"></i></div></div>`);
    r.appendChild(c); return { c, x, y, rz };
  });
  const xs = cards.map((k) => { const x = el('<div class="xmark">✕</div>'); r.appendChild(x); return x; });
  const t1 = el('<div class="abs center white-text" style="font-size:120px;top:0">רוב התוכניות</div>'); r.appendChild(t1);
  const t2 = el('<div class="abs center gold-text" style="font-size:150px;top:0;color:#e5484d;background:none;-webkit-text-fill-color:#ff5a5f;filter:drop-shadow(0 0 30px rgba(255,80,80,.55))">נכשלות.</div>'); r.appendChild(t2);
  return { cards, xs, t1, t2 };
}, (t, c, sc) => {
  const lt = t - sc.a;
  c.cards.forEach((k, i) => {
    const inK = E.back(prog(lt + 0.42, 0.05 + i * 0.12, 0.55 + i * 0.12));
    const fall = E.in(prog(t, L.why.start + 0.1 + i * 0.08, L.why.start + 1.0 + i * 0.08));
    setT(k.c, { x: k.x, y: k.y + (1 - inK) * 240 + fall * 1400, rz: k.rz + fall * (i % 2 ? 40 : -40), rx: 18, s: 0.86 + inK * 0.14, o: clamp(inK * 1.2) * (1 - fall * 0.6) });
    const xk = E.back(prog(lt, 0.75 + i * 0.13, 1.05 + i * 0.13));
    setT(c.xs[i], { x: k.x + 300, y: k.y + 30 + fall * 1400, s: xk * 1, rz: -8, o: xk * (1 - fall) });
  });
  const a1 = E.out(prog(lt + 0.3, 0.0, 0.6)), a2 = E.expo(prog(lt, 0.95, 1.2));
  const shake = lt > 0.95 && lt < 1.3 ? Math.sin(lt * 90) * 10 * (1 - prog(lt, 0.95, 1.3)) : 0;
  setT(c.t1, { y: 1160 + (1 - a1) * 60, o: a1, x: shake });
  setT(c.t2, { y: 1290, s: lerp(2.4, 1, a2), o: a2, x: -shake });
});

// 2. WHY --------------------------------------------------------------------------------------
scene('why', ...T.why, (r) => {
  const a = el('<div class="abs center white-text" style="font-size:150px">לא בגללך.</div>'); r.appendChild(a);
  const b = el('<div class="abs center" style="font-family:Heebo;font-weight:800;font-size:76px;color:#cfc6b4">הן פשוט לא נבנו</div>'); r.appendChild(b);
  const c2 = el('<div class="abs center gold-text" style="font-size:140px">בשבילך.</div>'); r.appendChild(c2);
  const line = el('<div class="abs" style="height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,#e2bd62,transparent)"></div>'); r.appendChild(line);
  return { a, b, c2, line };
}, (t, c, sc) => {
  const lt = t - sc.a;
  const k1 = E.out(prog(lt, 0, 0.45));
  setT(c.a, { y: 620 + (1 - k1) * 80, o: k1, s: lerp(1.15, 1, k1), blur: (1 - k1) * 16 });
  const w2 = L.why.words.find((w) => w.w.startsWith('הן'))?.t ?? L.why.start + 1.2;
  const k2 = E.out(prog(t, w2 - 0.1, w2 + 0.35));
  setT(c.b, { y: 860 + (1 - k2) * 50, o: k2 });
  const w3 = L.why.words.find((w) => w.w.startsWith('בשביל'))?.t ?? L.why.start + 2.6;
  const k3 = E.back(prog(t, w3 - 0.12, w3 + 0.35));
  setT(c.c2, { y: 960, s: lerp(0.6, 1, k3), o: clamp(k3 * 1.4) });
  const kl = E.io(prog(t, w3 + 0.1, w3 + 0.6));
  c.line.style.width = 700 * kl + 'px'; setT(c.line, { x: 540 - 350 * kl, y: 1150, o: kl });
  // exit: zoom-through
  const ex = E.in(prog(t, sc.b - 0.35, sc.b));
  sc.root.style.transform = `scale(${1 + ex * 2.4})`; sc.root.style.opacity = 1 - ex;
});

// 3. BRAND ------------------------------------------------------------------------------------
scene('brand', ...T.brand, (r) => {
  const mark = el(`<div class="abs" style="width:300px;height:300px;border-radius:82px;background:linear-gradient(135deg,#8a6420,#c9a24a 38%,#ffefb8 55%,#b8892e 78%,#8a6420);display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 120px rgba(232,200,121,.45),inset 0 4px 0 rgba(255,255,255,.45)">
    <span style="font-family:'Frank Ruhl Libre';font-weight:900;font-size:230px;color:#1a1408;line-height:1;margin-top:-10px">P</span></div>`);
  r.appendChild(mark);
  const word = el('<div class="abs center gold-text" style="font-size:190px;letter-spacing:.28em;direction:ltr;padding-left:.28em">PRIME</div>'); r.appendChild(word);
  const sub = el('<div class="abs center" style="font-size:52px;font-weight:600;letter-spacing:.12em;color:#d9cba6">המאמן האישי שלך</div>'); r.appendChild(sub);
  const rings = [0, 1, 2].map(() => { const g = el('<div class="ring"></div>'); r.appendChild(g); return g; });
  const sweep = el('<div class="abs" style="width:260px;height:1920px;background:linear-gradient(90deg,transparent,rgba(255,244,210,.55),transparent);transform:skewX(-18deg);mix-blend-mode:overlay"></div>'); r.appendChild(sweep);
  return { mark, word, sub, rings, sweep };
}, (t, c, sc) => {
  const hit = L.brand.words.find((w) => w.w.startsWith('פריים'))?.t ?? L.brand.start + 0.5;
  const km = E.back(prog(t, hit - 0.45, hit + 0.1));
  setT(c.mark, { x: 390, y: 540, ry: (1 - km) * -160, rx: (1 - km) * 30, s: lerp(0.2, 1, km), o: clamp(km * 2), z: (1 - km) * -600 });
  const kw = E.out(prog(t, hit - 0.05, hit + 0.5));
  c.word.style.letterSpacing = lerp(0.6, 0.28, kw) + 'em';
  setT(c.word, { y: 900, o: kw, blur: (1 - kw) * 20 });
  const ks = E.out(prog(t, hit + 0.35, hit + 0.8));
  setT(c.sub, { y: 1150, o: ks });
  c.rings.forEach((g, i) => {
    const k = prog(t, hit + i * 0.12, hit + 0.9 + i * 0.12);
    const d = 300 + E.out(k) * 1300; g.style.width = g.style.height = d + 'px';
    setT(g, { x: 540 - d / 2, y: 690 - d / 2, o: (1 - k) * (k > 0 ? 0.8 : 0) });
  });
  const kx = prog(t, hit + 0.15, hit + 0.9);
  setT(c.sweep, { x: lerp(-400, 1300, kx), o: kx > 0 && kx < 1 ? 1 : 0 });
  const ex = E.in(prog(t, sc.b - 0.3, sc.b));
  sc.root.style.opacity = 1 - ex; sc.root.style.transform = `translateY(${-ex * 300}px) scale(${1 - ex * 0.2})`;
});

// headline helper for app scenes
function headline(r, top, sub) {
  const h = el(`<div class="abs center gold-text" style="font-size:96px;line-height:1.05">${top}</div>`); r.appendChild(h);
  const s = sub ? el(`<div class="abs center" style="font-size:46px;font-weight:700;color:#d9cba6;letter-spacing:.02em">${sub}</div>`) : null; if (s) r.appendChild(s);
  return { h, s };
}
function drawHead(c, t, a, y = 150) {
  const k = E.out(prog(t, a, a + 0.45));
  setT(c.h, { y: y + (1 - k) * 40, o: k, blur: (1 - k) * 10 });
  if (c.s) setT(c.s, { y: y + 118 + (1 - k) * 30, o: E.out(prog(t, a + 0.15, a + 0.6)) });
}
function exitWhip(sc, t, dir = 1) { // whip-pan exit
  const ex = E.in(prog(t, sc.b - LEAD, sc.b));
  sc.root.style.transform = `translateX(${dir * ex * 1300}px)`; sc.root.style.filter = ex > 0.02 ? `blur(${ex * 26}px)` : ''; sc.root.style.opacity = 1 - ex * 0.4;
}
function enterWhip(sc, t, dir = 1) {
  const en = 1 - E.out(prog(t, sc.a, sc.a + LEAD + 0.12));
  return { x: -dir * en * 1300, blur: en * 26 };
}

// 4. ONE PLACE -------------------------------------------------------------------------------
scene('one', ...T.one, (r) => {
  const hd = headline(r, 'תפריט + אימונים', 'מטרה אחת. מקום אחד.');
  const p1 = phone('30-menu'), p2 = phone('40-training'), p3 = phone(['07-plan', '08-plan-training']);
  [p1, p2, p3].forEach((p) => r.appendChild(p));
  const plus = el('<div class="abs center gold-text" style="font-size:200px">+</div>'); r.appendChild(plus);
  return { ...hd, p1, p2, p3, plus };
}, (t, c, sc) => {
  const lt = t - sc.a;
  drawHead(c, t, sc.a + 0.05);
  const kin = E.out(prog(lt, 0, 0.7));
  const merge = E.io(prog(t, L.one.start + 2.6, L.one.start + 3.4));
  const sides = 1 - merge;
  setT(c.p1, { x: PX + lerp(560, 230, kin) * sides, y: 420, z: -260 * sides, ry: -28 * sides, rz: 6 * sides, s: 0.82 - 0.1 * merge, o: kin * (1 - merge) });
  setT(c.p2, { x: PX - lerp(560, 230, kin) * sides, y: 420, z: -260 * sides, ry: 28 * sides, rz: -6 * sides, s: 0.82 - 0.1 * merge, o: kin * (1 - merge) });
  setT(c.plus, { y: 820, o: kin * (1 - merge) * E.out(prog(lt, 0.4, 0.8)), s: 1 + 0.08 * Math.sin(lt * 6) });
  const k3 = E.back(prog(t, L.one.start + 3.0, L.one.start + 3.7));
  setT(c.p3, { x: PX, y: 380, s: lerp(0.4, 0.9, k3), o: clamp(k3 * 1.5), ry: (1 - k3) * 40 });
  showImg(c.p3, clamp(prog(t, L.one.start + 4.4, L.one.start + 4.9)));
  exitWhip(sc, t, -1);
});

// 5. CAMERA ----------------------------------------------------------------------------------
scene('camera', ...T.camera, (r) => {
  const hd = headline(r, 'מצלמים. סורקים. נרשם.', 'זיהוי אוכל מתמונה וברקוד');
  const p = phone(['20-camera', '21-camera-result', '21b-basket', '22-barcode']); r.appendChild(p);
  const scan = el('<div class="abs" style="width:560px;height:10px;border-radius:5px;background:linear-gradient(90deg,transparent,#f6e2a6,transparent);box-shadow:0 0 40px #e2bd62"></div>'); r.appendChild(scan);
  const c1 = el('<div class="chip">משרד הבריאות</div>'); r.appendChild(c1);
  const c2 = el('<div class="chip dark"><span class="counter" data-n="67624">0</span> מוצרים מהסופר</div>'); r.appendChild(c2);
  return { ...hd, p, scan, c1, c2 };
}, (t, c, sc) => {
  drawHead(c, t, sc.a + 0.1);
  const en = enterWhip(sc, t, -1);
  const lt = t - sc.a;
  const tilt = Math.sin(lt * 0.9) * 4;
  setT(c.p, { x: PX + en.x, y: 440, s: 0.86, ry: -10 + tilt, rx: 6, blur: en.blur });
  // 0: camera, 1: result (after scan), 2: basket, 3: barcode
  const shutter = L.camera.start + 0.7;
  const idx = E.io(prog(t, shutter + 0.2, shutter + 0.5)) + E.io(prog(t, L.camera.start + 2.0, L.camera.start + 2.4)) + E.io(prog(t, L.camera.start + 4.0, L.camera.start + 4.4));
  showImg(c.p, Math.min(3, idx), 1);
  const ks = prog(t, shutter + 0.2, shutter + 1.4);
  setT(c.scan, { x: PX + 30 + en.x, y: 640 + ks * 700, o: ks > 0 && ks < 1 ? 1 : 0 });
  const k1 = E.back(prog(t, L.camera.start + 3.2, L.camera.start + 3.6));
  setT(c.c1, { x: RX(c.c1), y: 1290, s: k1, o: clamp(k1 * 2), rz: -4 });
  const k2 = E.back(prog(t, L.camera.start + 2.2, L.camera.start + 2.6));
  setT(c.c2, { x: 70, y: 1150, s: k2, o: clamp(k2 * 2), rz: 3 });
  const n = Math.round(67624 * E.out(prog(t, L.camera.start + 2.2, L.camera.start + 3.6)));
  c.c2.querySelector('.counter').textContent = n.toLocaleString('en-US');
  exitWhip(sc, t, -1);
});

// 6. MENU ------------------------------------------------------------------------------------
scene('menu', ...T.menu, (r) => {
  const hd = headline(r, 'משתנה לפי האימון', 'פחמימה לפני. חלבון אחרי.');
  const p = phone(['30-menu', '31-menu-workout-meals']); r.appendChild(p);
  const h1 = el('<div class="chip">⚡ לפני אימון</div>'), h2 = el('<div class="chip dark">💪 אחרי אימון</div>'); r.appendChild(h1); r.appendChild(h2);
  const tg = el('<div class="chip dark">🇮🇱 מטבח ישראלי · 110 מתכונים</div>'); r.appendChild(tg);
  return { ...hd, p, h1, h2, tg };
}, (t, c, sc) => {
  drawHead(c, t, sc.a + 0.1);
  const en = enterWhip(sc, t, -1);
  const lt = t - sc.a;
  const sw = E.io(prog(t, L.menu.start + 1.3, L.menu.start + 1.8));
  setT(c.p, { x: PX + en.x, y: 440 - sw * 40, s: 0.86 + sw * 0.04, ry: 12 - lt * 2, rx: 5, blur: en.blur });
  showImg(c.p, sw);
  // highlight the pre/post tags on screen 31 (positions measured on the capture)
  const k1 = E.out(prog(t, L.menu.start + 2.2, L.menu.start + 2.6)), k2 = E.out(prog(t, L.menu.start + 2.8, L.menu.start + 3.2));
  setT(c.h1, { x: RX(c.h1), y: 980, s: E.back(prog(t, L.menu.start + 2.2, L.menu.start + 2.55)), o: k1, rz: -4 });
  setT(c.h2, { x: 60, y: 1110, s: E.back(prog(t, L.menu.start + 2.8, L.menu.start + 3.15)), o: k2, rz: 4 });
  const kt = E.back(prog(t, L.menu.start + 0.4, L.menu.start + 0.8));
  setT(c.tg, { x: 120, y: 1410, s: kt, o: clamp(kt * 2) });
  exitWhip(sc, t, -1);
});

// 7. TRAINING --------------------------------------------------------------------------------
scene('train', ...T.train, (r) => {
  const hd = headline(r, 'מאמן כושר בכיס', 'חדר כושר · בית · אירובי');
  const ps = ['40-training', '42-session', '43-exercise'].map((s) => { const p = phone(s); r.appendChild(p); return p; });
  const cnt = el('<div class="chip"><span class="counter">0</span> תרגילים</div>'); r.appendChild(cnt);
  const c2 = el('<div class="chip dark">מפת שרירים · שעון מנוחה</div>'); r.appendChild(c2);
  return { ...hd, ps, cnt, c2 };
}, (t, c, sc) => {
  drawHead(c, t, sc.a + 0.1);
  const en = enterWhip(sc, t, -1);
  // carousel: 3 phones rotate around a cylinder, focus changes with the narration
  const step = E.io(prog(t, L.train.start + 1.6, L.train.start + 2.2)) + E.io(prog(t, L.train.start + 3.6, L.train.start + 4.2));
  c.ps.forEach((p, i) => {
    const a = (i - step) * 42; // degrees on cylinder
    const rad = a * Math.PI / 180;
    setT(p, { x: PX + Math.sin(rad) * -720 + en.x, y: 430, z: (Math.cos(rad) - 1) * 900, ry: a, s: 0.84, o: clamp(1.4 - Math.abs(i - step) * 0.7), blur: en.blur + Math.abs(i - step) * 3 });
    p.style.zIndex = String(10 - Math.round(Math.abs(i - step) * 3));
  });
  const kc = E.back(prog(t, L.train.start + 2.4, L.train.start + 2.8));
  setT(c.cnt, { x: RX(c.cnt), y: 1290, s: kc, o: clamp(kc * 2), rz: -3 });
  c.cnt.querySelector('.counter').textContent = Math.round(876 * E.out(prog(t, L.train.start + 2.4, L.train.start + 3.5)));
  const k2 = E.back(prog(t, L.train.start + 4.3, L.train.start + 4.7));
  setT(c.c2, { x: 70, y: 1150, s: k2, o: clamp(k2 * 2), rz: 3 });
  exitWhip(sc, t, -1);
});

// 8. BODY ------------------------------------------------------------------------------------
scene('body', ...T.body, (r) => {
  const hd = headline(r, 'רואים את השינוי', 'היום ← בדרך ← ביעד');
  const p = phone(['05-journey-1', '06-journey-2', '04-journey-goal']); r.appendChild(p);
  const tag = el('<div class="chip">−10 ק"ג ביעד</div>'); r.appendChild(tag);
  return { ...hd, p, tag };
}, (t, c, sc) => {
  drawHead(c, t, sc.a + 0.1);
  const en = enterWhip(sc, t, -1);
  const lt = t - sc.a;
  // push-in on the body view, stepping through the three buttons
  const idx = E.io(prog(t, L.body.start + 1.0, L.body.start + 1.35)) + E.io(prog(t, L.body.start + 2.1, L.body.start + 2.45));
  const push = E.io(prog(lt, 0.3, 3.4));
  setT(c.p, { x: PX + en.x, y: 430 + push * 150, s: 0.86 + push * 0.3, rx: 4 - push * 3, ry: Math.sin(lt) * 3, blur: en.blur });
  showImg(c.p, idx, 0.6);
  const kt = E.back(prog(t, L.body.start + 2.5, L.body.start + 2.9));
  setT(c.tag, { x: RX(c.tag), y: 1250, s: kt, o: clamp(kt * 2), rz: -4 });
  exitWhip(sc, t, -1);
});

// 9. TRUST -----------------------------------------------------------------------------------
scene('trust', ...T.trust, (r) => {
  const words = ['חיטוב', 'מסה', 'ריקומפוזיציה'].map((w) => { const d = el(`<div class="abs center gold-text" style="font-size:130px">${w}</div>`); r.appendChild(d); return d; });
  const p = phone(['01-goal', '12-why']); r.appendChild(p);
  const seals = ['ISSN', 'ACSM', 'WHO', 'משרד הבריאות'].map((s) => { const d = el(`<div class="seal">${s}</div>`); r.appendChild(d); return d; });
  const head = el('<div class="abs center gold-text" style="font-size:92px">מבוסס מחקר</div>'); r.appendChild(head);
  const sub = el('<div class="abs center" style="font-size:46px;font-weight:700;color:#d9cba6">עם גבולות בטיחות מובנים</div>'); r.appendChild(sub);
  const shield = el(`<svg class="shield" viewBox="0 0 100 116"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e2a6"/><stop offset=".5" stop-color="#d8b45e"/><stop offset="1" stop-color="#8f6c27"/></linearGradient></defs><path d="M50 4 L92 18 V58 C92 84 72 102 50 112 C28 102 8 84 8 58 V18 Z" fill="url(#sg)"/><path d="M30 58 L45 73 L72 44" fill="none" stroke="#1a1408" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`); r.appendChild(shield);
  return { words, p, seals, head, sub, shield };
}, (t, c, sc) => {
  const en = enterWhip(sc, t, -1);
  const ws = L.trust.words;
  const at = (pre) => ws.find((w) => w.w.startsWith(pre))?.t ?? sc.a;
  const times = [at('חיטוב'), at('מסה'), at('ריקומפוזיציה')];
  const phase2 = at('כל') - 0.1;
  c.words.forEach((d, i) => {
    const k = E.back(prog(t, times[i] - 0.08, times[i] + 0.25));
    const out = E.in(prog(t, (times[i + 1] ?? phase2) - 0.1, (times[i + 1] ?? phase2) + 0.1));
    setT(d, { y: 700, s: lerp(1.6, 1, k) * (1 - out * 0.3), o: clamp(k * 2) * (1 - out), x: en.x, blur: (1 - k) * 12 + out * 12 });
  });
  const k2 = E.out(prog(t, phase2, phase2 + 0.5));
  setT(c.head, { y: 150 + (1 - k2) * 40, o: k2 });
  setT(c.sub, { y: 268, o: E.out(prog(t, phase2 + 0.15, phase2 + 0.6)) });
  setT(c.p, { x: PX, y: 440, s: 0.8, ry: -14, rx: 4, o: k2, z: (1 - k2) * -500 });
  showImg(c.p, E.io(prog(t, phase2 + 1.0, phase2 + 1.5)));
  const ps = [[50, 1060], [-1, 980], [50, 1200], [-1, 1120]];
  c.seals.forEach((d, i) => { const k = E.back(prog(t, phase2 + 0.5 + i * 0.18, phase2 + 0.85 + i * 0.18)); setT(d, { x: ps[i][0] < 0 ? RX(d, 50) : ps[i][0], y: ps[i][1], s: k, o: clamp(k * 2), rz: i % 2 ? 4 : -4 }); });
  const kb = E.back(prog(t, at('גבולות') - 0.1, at('גבולות') + 0.3));
  setT(c.shield, { x: 445, y: 380, s: kb * 1.1, o: clamp(kb * 2) * (1 - prog(t, sc.b - 0.4, sc.b)), z: 300 });
  const ex = E.in(prog(t, sc.b - 0.3, sc.b));
  sc.root.style.opacity = 1 - ex; sc.root.style.transform = `scale(${1 - ex * 0.15})`; sc.root.style.filter = ex > 0.02 ? `blur(${ex * 18}px)` : '';
});

// 10. CTA ------------------------------------------------------------------------------------
scene('cta', ...T.cta, (r) => {
  const mark = el(`<div class="abs" style="width:220px;height:220px;border-radius:62px;background:linear-gradient(135deg,#8a6420,#c9a24a 38%,#ffefb8 55%,#b8892e 78%,#8a6420);display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 120px rgba(232,200,121,.45)"><span style="font-family:'Frank Ruhl Libre';font-weight:900;font-size:170px;color:#1a1408;line-height:1;margin-top:-6px">P</span></div>`); r.appendChild(mark);
  const word = el('<div class="abs center gold-text" style="font-size:170px;letter-spacing:.26em;direction:ltr;padding-left:.26em">PRIME</div>'); r.appendChild(word);
  const tag = el('<div class="abs center white-text" style="font-size:84px">המאמן שתמיד איתך.</div>'); r.appendChild(tag);
  const btn = el('<div class="abs" style="padding:34px 90px;border-radius:999px;font-size:66px;font-weight:900;color:#1a1408;background:linear-gradient(135deg,#9c7a32,#d8b45e 35%,#fff1c4 52%,#d1a94f 72%,#8f6c27);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 80px rgba(232,200,121,.35),inset 0 3px 0 rgba(255,255,255,.45);white-space:nowrap">מתחילים היום ←</div>'); r.appendChild(btn);
  const small = el('<div class="abs center" style="font-size:40px;font-weight:600;color:#bfb39a;letter-spacing:.06em">תזונה · אימונים · התקדמות · במקום אחד</div>'); r.appendChild(small);
  const p1 = phone('10-today'), p2 = phone('40-training'), p3 = phone('04-journey-goal');
  [p1, p2, p3].forEach((p) => r.insertBefore(p, r.firstChild));
  return { mark, word, tag, btn, small, ps: [p1, p2, p3] };
}, (t, c, sc) => {
  const hit = L.cta.start + 0.05;
  const km = E.back(prog(t, hit - 0.25, hit + 0.3));
  setT(c.mark, { x: 430, y: 470, s: km, o: clamp(km * 2), ry: (1 - km) * 90 });
  const kw = E.out(prog(t, hit, hit + 0.5));
  c.word.style.letterSpacing = lerp(0.55, 0.26, kw) + 'em';
  setT(c.word, { y: 730, o: kw, blur: (1 - kw) * 14 });
  const tagT = L.cta.words.find((w) => w.w.startsWith('המאמן'))?.t ?? hit + 1;
  const kt = E.out(prog(t, tagT - 0.1, tagT + 0.4));
  setT(c.tag, { y: 960 + (1 - kt) * 40, o: kt });
  const goT = L.cta.words.find((w) => w.w.startsWith('מתחילים'))?.t ?? hit + 3;
  const kb = E.back(prog(t, goT - 0.1, goT + 0.3));
  const pulse = 1 + Math.max(0, Math.sin((t - goT) * 5)) * 0.03 * prog(t, goT + 0.4, goT + 0.6);
  c.btn.style.left = '0px';
  const bw = c.btn.offsetWidth || 700;
  setT(c.btn, { x: 540 - bw / 2, y: 1150, s: kb * pulse, o: clamp(kb * 2) });
  setT(c.small, { y: 1340, o: E.out(prog(t, goT + 0.4, goT + 0.9)) * 0.9 });
  // faint phones in the background, fanned
  c.ps.forEach((p, i) => {
    const k = E.out(prog(t, sc.a, sc.a + 1.2));
    setT(p, { x: PX + (i - 1) * 380, y: 520 + Math.abs(i - 1) * 60, z: -900, ry: (i - 1) * -22, rz: (i - 1) * 6, s: 0.9, o: 0.16 * k });
  });
  // end: fade to black
  const fo = prog(t, TL.total - 0.6, TL.total);
  sc.root.style.opacity = 1 - fo;
});

// ---------------- background, particles, grain, flash, captions ----------------
const bg = document.getElementById('bg'), g1 = document.getElementById('g1'), g2 = document.getElementById('g2');
const pc = document.getElementById('particles').getContext('2d');
const P = Array.from({ length: 140 }, (_, i) => { seed = i + 7; return { x: rnd() * 1080, y: rnd() * 1920, r: 0.8 + rnd() * 3.2, v: 8 + rnd() * 40, ph: rnd() * 6.28, a: 0.15 + rnd() * 0.5 }; });
const gc = document.getElementById('grain').getContext('2d');
const gimg = gc.createImageData(270, 480);
const flash = document.getElementById('flash');
const FLASH_AT = [L.brand.words[0].t + 0.05, L.cta.start + 0.05];

// the source text carries punctuation; WordBoundary words don't, so restore it from the script
TL.lines.forEach((l) => {
  const toks = l.text.split(/\s+/);
  l.words.forEach((w, i) => { if (toks[i] && toks[i].replace(/[.,!?]/g, '') === w.w) w.w = toks[i]; });
});
// captions: chunks of up to 4 words (break on punctuation)
const chunks = [];
TL.lines.forEach((l) => {
  let cur = [];
  l.words.forEach((w, i) => {
    cur.push(w);
    const end = /[.,!?]$/.test(w.w) || cur.length >= 4 || i === l.words.length - 1;
    if (end) { chunks.push({ words: cur, a: cur[0].t - 0.06, b: (l.words[i + 1]?.t ?? l.end) - 0.02 }); cur = []; }
  });
});
const capEl = document.getElementById('caption');
let lastChunk = -1;

window.render = (t) => {
  // background drift
  bg.style.background = `radial-gradient(1200px 900px at ${50 + Math.sin(t * 0.3) * 12}% ${38 + Math.cos(t * 0.23) * 8}%, #1c160b 0%, #0a0907 55%, #050403 100%)`;
  setT(g1, { x: 90 + Math.sin(t * 0.4) * 160, y: 260 + Math.cos(t * 0.33) * 140, o: 0.2 + Math.sin(t * 0.7) * 0.05 });
  setT(g2, { x: 300 + Math.cos(t * 0.27) * 220, y: 1100 + Math.sin(t * 0.31) * 160 });
  // gold dust
  pc.clearRect(0, 0, 1080, 1920);
  P.forEach((p) => {
    const y = (p.y - t * p.v + 1920 * 4) % 1920, x = p.x + Math.sin(t * 0.8 + p.ph) * 20;
    const tw = 0.6 + 0.4 * Math.sin(t * 3 + p.ph);
    pc.beginPath(); pc.arc(x, y, p.r, 0, 6.283);
    pc.fillStyle = `rgba(243,214,140,${p.a * tw})`; pc.shadowColor = 'rgba(243,214,140,.8)'; pc.shadowBlur = 8; pc.fill();
  });
  // a slow light sweep across the phone glass
  const gl = ((t * 0.22) % 1) * 160 - 30;
  document.querySelectorAll('.phone .glare').forEach((g) => { g.style.background = `linear-gradient(115deg, transparent ${gl - 14}%, rgba(255,245,220,.2) ${gl}%, transparent ${gl + 13}%)`; });
  // scenes
  scenes.forEach((sc) => {
    const on = t >= sc.a && t < sc.b;
    sc.root.style.display = on ? 'block' : 'none';
    if (on) { sc.root.style.transform = ''; sc.root.style.filter = ''; sc.root.style.opacity = 1; sc.draw(t, sc.ctx, sc); }
  });
  // flash hits
  let fl = 0; FLASH_AT.forEach((a) => { const k = prog(t, a, a + 0.5); if (k > 0 && k < 1) fl = Math.max(fl, (1 - k) * (1 - k)); });
  // whip transitions get a soft flash too
  Object.values(T).forEach(([a]) => { const k = prog(t, a, a + 0.18); if (a > 1 && k > 0 && k < 1) fl = Math.max(fl, (1 - k) * 0.35); });
  flash.style.opacity = fl;
  // grain
  seed = Math.floor(t * 30) * 9973 + 1;
  for (let i = 0; i < gimg.data.length; i += 4) { const v = rnd() * 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
  gc.putImageData(gimg, 0, 0);
  // captions
  const ci = chunks.findIndex((c) => t >= c.a && t < c.b);
  if (ci !== lastChunk) {
    lastChunk = ci;
    capEl.innerHTML = ci < 0 ? '' : `<span class="cap">${chunks[ci].words.map((w, i) => `<span class="w" data-i="${i}">${w.w}</span>`).join(' ')}</span>`;
  }
  if (ci >= 0) {
    const ch = chunks[ci];
    capEl.querySelectorAll('.w').forEach((n, i) => { const w = ch.words[i]; n.className = 'w ' + (t >= w.t && t < (ch.words[i + 1]?.t ?? ch.b) ? 'on' : t >= w.t ? 'past' : 'future'); });
    const k = E.back(prog(t, ch.a, ch.a + 0.18));
    const cap = capEl.firstChild; if (cap) { cap.style.transform = `translateY(${(1 - k) * 24}px) scale(${0.94 + 0.06 * k})`; cap.style.opacity = clamp(k * 2); }
  }
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => (im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; })))]);
</script>
</body>
</html>
